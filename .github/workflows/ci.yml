name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            fonts-noto-core fonts-noto-arabic

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the sample dataset
        run: python -m scripts.generate_sample --out data/sample_transactions.csv --rows 1500

      - name: Run the engine test suite
        run: python -m pytest tests/test_apriori.py tests/test_loader.py -q

  interface:
    name: Interface tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            fonts-noto-core fonts-noto-arabic

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the sample dataset
        run: python -m scripts.generate_sample --out data/sample_transactions.csv --rows 1500

      - name: Run the full test suite
        run: python -m pytest tests/ -q

      - name: Render every screen for visual review
        run: python scripts/render_screens.py --out renders

      - name: Upload the rendered screens
        uses: actions/upload-artifact@v4
        with:
          name: screen-renders
          path: renders/
          if-no-files-found: warn
